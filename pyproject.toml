[project]
name = "snipe-cli"
version = "0.1.1"
description = "CLI and Python package for bird photo detection, species classification, and XMP region tagging."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [
	{name = "woolen-sheep", email = "2460563632@qq.com"},
]
dependencies = [
	"loguru",
	"pillow",
	"numpy",
	"pydantic>=2.9.0",
	"pyyaml>=6.0.2",
	"exifmwg>=0.6.0",
	"pyexiv2>=2.15.5",
	"rawpy>=0.25.1",
	"pywebview>=5.2",
	"tqdm>=4.66.0",
]

[project.optional-dependencies]
cpu = [
	"onnxruntime>=1.20.0",
]
gpu = [
	"onnxruntime-gpu>=1.20.0",
]

[dependency-groups]
dev = [
	"pytest>=8.3.0",
	"tensorflow",
	"tf2onnx",
	"twine",
]

[project.scripts]
snipe = "snipe.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

packages = ["snipe", "snipe.resources", "snipe.web", "snipe.web.preview"]

[tool.setuptools.package-data]
snipe = ["resources/*.csv", "resources/*.json", "resources/*.txt", "web/preview/*"]
